backend:
  name: git-gateway
  branch: main
  repo: raqeemart-collab/mk-menu
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "menu"
    label: "المنيو"
    files:
      - file: "menu.json"
        label: "أصناف المنيو"
        name: "menu"
        fields:
          - {label: "الأقسام", name: "categories", widget: "list", fields: [{label: "اسم القسم", name: "name", widget: "string"}, {label: "الأصناف", name: "items", widget: "list", fields: [{label: "الاسم", name: "name", widget: "string"}, {label: "السعر", name: "price", widget: "number"}]}]}
